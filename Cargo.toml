[package]
name = "directmessages"
version = "0.1.0"
edition = "2021"
description = "DirectMessages - encrypted peer-to-peer messenger over TCP (Rust)"
license = "AGPL-3.0"
authors = ["rizer01"]

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hex = "0.4"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
